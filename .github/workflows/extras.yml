name: extras

# Tier-2 checks: non-blocking builds for optional targets. Every job here is
# continue-on-error so a red run never gates a PR; treat failures as signal
# for the wasm/example code paths drifting, not as a merge blocker.
on:
  pull_request:
  push:
    branches-ignore:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Emscripten build of wasm/dinov2-wasm.cpp (DINOV2_BUILD_WASM). Produces
  # build-wasm/bin/dinov2-wasm.{js,wasm}; see docs/wasm.md.
  wasm:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Configure (wasm preset)
        run: cmake --preset wasm

      - name: Build dinov2-wasm
        run: cmake --build --preset wasm -j"$(nproc)"

      - name: Check artifacts
        run: |
          ls -lh build-wasm/bin/dinov2-wasm.js build-wasm/bin/dinov2-wasm.wasm
          node --check build-wasm/bin/dinov2-wasm.js 2>/dev/null || \
            node --input-type=module --check < build-wasm/bin/dinov2-wasm.js

      - name: Upload wasm bundle
        uses: actions/upload-artifact@v4
        with:
          name: dinov2-wasm
          path: |
            build-wasm/bin/dinov2-wasm.js
            build-wasm/bin/dinov2-wasm.wasm
            wasm/index.html
            wasm/main.js
          retention-days: 14

  # dinov2-server (tools/server/, DINOV2_BUILD_SERVER): build it, download
  # the small GGUF (same pattern as the build.yml contract job, minus the
  # hf CLI: a plain /resolve/ curl works for public repos), then curl
  # /health and POST assets/tench.jpg to /v1/embeddings.
  server:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Build dinov2-server
        run: |
          cmake -B build-server -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DDINOV2_BUILD_SERVER=ON -DDINOV2_BUILD_TESTS=OFF
          cmake --build build-server --target dinov2-server -j"$(nproc)"

      - name: Download small GGUF
        run: |
          mkdir -p models/dinov2-small
          curl -L -o models/dinov2-small/model.gguf \
            https://huggingface.co/dinov2-cpp-core/dinov2-small-gguf/resolve/main/model.gguf

      - name: Smoke test endpoints
        run: |
          ./build-server/bin/dinov2-server \
            -m models/dinov2-small/model.gguf --port 18080 --threads 2 &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:18080/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:18080/v1/models | jq -e '.hidden_size == 384'
          curl -sf -F image=@assets/tench.jpg \
            http://127.0.0.1:18080/v1/embeddings \
            | jq -e '(.cls | length) == 384 and (.grid.h * .grid.w == .n_patches)'
          B64=$(base64 -w0 assets/tench.jpg)
          curl -sf -X POST http://127.0.0.1:18080/v1/embeddings \
            -H 'Content-Type: application/json' \
            -d "{\"image\":\"$B64\",\"l2_normalize\":true}" \
            | jq -e '(.cls | length) == 384'

  # examples/: syntax checks only. These are copy-paste examples for users,
  # not wired gates; the job just keeps them from rotting.
  examples:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check dedup.py syntax
        run: python3 -m py_compile examples/dedup/dedup.py

      - name: Check example workflow YAML parses
        run: |
          sudo apt-get update && sudo apt-get install -y python3-yaml
          python3 -c "
          import yaml
          doc = yaml.safe_load(open('examples/ci-visual-regression/visual-regression.yml'))
          assert 'jobs' in doc and 'compare' in doc['jobs'], 'missing compare job'
          print('example workflow parses')
          "

      - name: actionlint on the example workflow
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -oneline examples/ci-visual-regression/visual-regression.yml

  # End-to-end proof of examples/ci-visual-regression/visual-regression.yml:
  # materializes baseline/ + screenshots/ from the committed fixtures, then
  # runs the same release-tarball + cosine-gate steps so the public run log
  # shows the gate working on real images. Fixtures are synthetic UI mockups
  # (regenerate with examples/ci-visual-regression/make_fixtures.py): two
  # nearly identical pairs pass, and a screenshots-only settings.png is
  # reported NEW instead of failing, so a healthy run stays green.
  visual-regression:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      THRESHOLD: "0.98"
      MODEL_REPO: "dinov2-cpp-core/dinov2-small-gguf"
    steps:
      - uses: actions/checkout@v4

      - name: Materialize baseline/ and screenshots/ from fixtures
        run: |
          cp -r examples/ci-visual-regression/fixtures/baseline baseline
          cp -r examples/ci-visual-regression/fixtures/screenshots screenshots
          find baseline screenshots -type f | sort

      - name: Download dinov2-cli release binary
        run: |
          TAG=$(basename "$(curl -sIL -o /dev/null -w '%{url_effective}' \
            https://github.com/espetro/dinov2.cpp/releases/latest)")
          curl -LO "https://github.com/espetro/dinov2.cpp/releases/download/$TAG/dinov2-$TAG-bin-ubuntu-x64.tar.gz"
          curl -LO "https://github.com/espetro/dinov2.cpp/releases/download/$TAG/SHA256SUMS.txt"

      - name: Verify checksums and unpack
        run: |
          TARBALL=$(ls dinov2-*-bin-ubuntu-x64.tar.gz)
          grep " $TARBALL\$" SHA256SUMS.txt > check.sums
          sha256sum -c check.sums
          tar xzf "$TARBALL"
          find . -name dinov2-cli -type f

      - name: Download GGUF weight
        run: |
          mkdir -p models
          curl -L -o models/model.gguf \
            "https://huggingface.co/$MODEL_REPO/resolve/main/model.gguf"

      - name: Embed baseline and screenshot fixtures
        run: |
          CLI=$(find . -name dinov2-cli -type f | head -1)
          mkdir -p emb
          embed() {
            args=()
            while IFS= read -r f; do args+=(-i "$f"); done \
              < <(find "$1" -maxdepth 1 \( -name '*.png' -o -name '*.jpg' \) | sort)
            if [ "${#args[@]}" -eq 0 ]; then
              echo "no images in $1/"; return 0
            fi
            "$CLI" -m models/model.gguf --preprocess crop518 --batch 8 \
              --print-embeddings "${args[@]}" > "$2"
          }
          embed baseline emb/baseline.jsonl
          embed screenshots emb/current.jsonl

      - name: Compare embeddings (cosine >= THRESHOLD)
        run: |
          python3 - <<'PY'
          import json, math, os, sys

          def load(path):
              out = {}
              for line in open(path):
                  r = json.loads(line)
                  out[os.path.basename(r["image"])] = r.get("pooled") or r["cls"]
              return out

          def cosine(a, b):
              dot = sum(x * y for x, y in zip(a, b))
              na = math.sqrt(sum(x * x for x in a))
              nb = math.sqrt(sum(x * x for x in b))
              return dot / (na * nb) if na and nb else 0.0

          threshold = float(os.environ["THRESHOLD"])
          base = load("emb/baseline.jsonl")
          curr = load("emb/current.jsonl")
          failed = []
          for name, bvec in sorted(base.items()):
              if name not in curr:
                  print(f"MISSING  {name}: no current screenshot")
                  failed.append(name)
                  continue
              s = cosine(bvec, curr[name])
              print(f"{'ok' if s >= threshold else 'FAIL'}  {s:.4f}  {name}")
              if s < threshold:
                  failed.append(name)
          for name in curr:
              if name not in base:
                  print(f"NEW      {name}: add to baseline/ if intentional")
          if failed:
              print(f"\n{len(failed)} screenshot(s) below {threshold}: {failed}")
              sys.exit(1)
          PY
