name: changelog

on:
  push:
    tags:
      - "v*"

# Serialize with the `release` workflow; both fire on the same tag push
# and contend for the working tree.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The tag push triggered this run; check out the *tag commit*
          # so git-cliff can see the release's commit history.
          ref: ${{ github.ref }}

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2

      - name: Inspect current CHANGELOG.md
        id: head
        run: |
          if [ -f CHANGELOG.md ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate CHANGELOG.md
        if: steps.head.outputs.exists == 'true'
        env:
          # `--unreleased --tag X --next-tag X` collapses the current
          # `[Unreleased]` body into the `[X]` section in one pass,
          # using X as both the upper and lower bound so only commits
          # between the previous and the current tag are processed.
          # Combined with `--use-branch-tags` (default false), this
          # prevents accidental re-generation of older releases.
          CLIFF_ARGS: --unreleased --tag ${{ github.ref_name }} --next-tag ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git-cliff "$CLIFF_ARGS" > CHANGELOG.md.new
          if ! diff -q CHANGELOG.md CHANGELOG.md.new > /dev/null; then
            mv CHANGELOG.md.new CHANGELOG.md
            echo "diff=true" >> "$GITHUB_OUTPUT"
          else
            rm -f CHANGELOG.md.new
            echo "diff=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR
        if: steps.head.outputs.exists == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          title: "chore(changelog): regenerate CHANGELOG.md for ${{ github.ref_name }}"
          commit-message: "chore(changelog): regenerate for ${{ github.ref_name }}"
          branch: "changelog/${{ github.ref_name }}"
          base: main
          push-to-fork: ${{ github.repository_owner == 'espetro' }}
          # Empty body; the diff speaks for itself.
          body: |
            Auto-generated by `.github/workflows/changelog.yml` after
            publishing the **${{ github.ref_name }}** tag.

            No edits intended; review by running

                git-cliff --tag ${{ github.ref_name }} --output CHANGELOG.md
                git diff CHANGELOG.md
            and confirming only the `[Unreleased] -> [${{ github.ref_name }}]`
            section + correct `YYYY-MM-DD` date changed.
          add-paths: CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}
