name: Convert and publish GGUF weights

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Variant to convert (short name from the matrix, or 'all')"
        required: false
        default: "all"
        type: string
  schedule:
    # Monthly, 1st of the month at 06:00 UTC
    - cron: "0 6 1 * *"

permissions:
  contents: read

concurrency:
  group: convert-and-publish-gguf
  cancel-in-progress: false

env:
  HF_HUB_ENABLE_HF_TRANSFER: "1"

jobs:
  validate:
    name: Validate conversion (dinov2-small)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Convert dinov2-small (dry run, no upload)
        run: SKIP_UPLOAD=1 bash scripts/publish-gguf.sh dinov2-small

  publish:
    name: Convert ${{ matrix.variant }}
    needs: validate
    if: ${{ !cancelled() && needs.validate.result == 'success' }}
    # Stays on ubuntu-latest (~14 GB free) instead of ubuntu-latest-large.
    # The conversion script installs a lean torch-CPU + transformers venv and
    # aggressively clears the HF hub cache after upload, which is enough to fit
    # the giant variant (~3 GB checkpoint + ~1.4 GB F16 GGUF + ~800 MB venv).
    # See scripts/publish-gguf.sh for the disk strategy.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: dinov2-small
          - variant: dinov2-base
          - variant: dinov2-large
          - variant: dinov2-giant
          - variant: dinov2-with-registers-small
          - variant: dinov2-with-registers-base
          - variant: dinov2-with-registers-large
          - variant: dinov2-with-registers-giant
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      # GitHub-hosted Linux runners use /home/runner as $HOME, so the HF cache
      # lands at /home/runner/.cache/huggingface. Pin it explicitly so the
      # cleanup step in scripts/publish-gguf.sh can find and rm-rf the
      # checkpoint directory without guessing. (runner.home isn't allowed in
      # env: expressions — only in steps / runs-on contexts.)
      HF_HOME: /home/runner/.cache/huggingface
    steps:
      - name: Skip unselected variants (manual dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.variant != 'all' && inputs.variant != matrix.variant }}
        run: echo "SKIP=true" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        if: env.SKIP != 'true'

      - uses: astral-sh/setup-uv@v5
        if: env.SKIP != 'true'

      - name: Cache .venv-publish (shared across matrix legs)
        if: env.SKIP != 'true'
        uses: actions/cache@v4
        with:
          path: .venv-publish/
          key: publish-venv-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            publish-venv-${{ runner.os }}-

      - name: Convert and publish ${{ matrix.variant }}
        if: env.SKIP != 'true'
        run: bash scripts/publish-gguf.sh "${{ matrix.variant }}"
