name: Convert and publish GGUF weights

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Variant to convert (short name from the matrix, or 'all')"
        required: false
        default: "all"
        type: string
  schedule:
    # Monthly, 1st of the month at 06:00 UTC
    - cron: "0 6 1 * *"

permissions:
  contents: read

concurrency:
  group: convert-and-publish-gguf
  cancel-in-progress: false

env:
  HF_HUB_ENABLE_HF_TRANSFER: "1"

jobs:
  plan:
    name: Resolve target matrix
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.set.outputs.variants }}
      should_validate: ${{ steps.set.outputs.should_validate }}
    steps:
      - id: set
        run: |
          ALL='dinov2-small dinov2-base dinov2-large dinov2-giant dinov2-with-registers-small dinov2-with-registers-base dinov2-with-registers-large dinov2-with-registers-giant'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.variant }}" != "all" ]; then
            echo "variants=${{ inputs.variant }}" >> "$GITHUB_OUTPUT"
            echo "should_validate=false" >> "$GITHUB_OUTPUT"
          else
            echo "variants=$ALL" >> "$GITHUB_OUTPUT"
            echo "should_validate=true" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: Validate conversion (dinov2-small)
    needs: plan
    if: needs.plan.outputs.should_validate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Convert dinov2-small (dry run, no upload)
        run: SKIP_UPLOAD=1 bash scripts/publish-gguf.sh dinov2-small

  publish:
    name: Convert ${{ matrix.variant }}
    needs: [plan, validate]
    if: ${{ !cancelled() && needs.validate.result == 'success' }}
    # Stays on ubuntu-latest (~14 GB free) instead of ubuntu-latest-large.
    # The conversion script installs a lean torch-CPU + transformers venv and
    # aggressively clears the HF hub cache after upload, which is enough to fit
    # the giant variant (~3 GB checkpoint + ~1.4 GB F16 GGUF + ~800 MB venv).
    # See scripts/publish-gguf.sh for the disk strategy.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.plan.outputs.variants) }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      # HF_HOME / TMPDIR / UV_CACHE_DIR are set by the "Relocate caches" step
      # below into /mnt (GitHub's ephemeral scratch volume, ~25-40 GB free)
      # to keep the runner's small root disk free for torch + transformers.
    steps:
      - name: Relocate caches to ephemeral /mnt scratch space
        run: |
          sudo mkdir -p /mnt/hf /mnt/tmp /mnt/uv-cache
          sudo chown -R "$(id -u)":"$(id -g)" /mnt/hf /mnt/tmp /mnt/uv-cache
          echo "HF_HOME=/mnt/hf" >> "$GITHUB_ENV"
          echo "TMPDIR=/mnt/tmp" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=/mnt/uv-cache" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Cache .venv-publish (shared across matrix legs)
        uses: actions/cache@v4
        with:
          path: .venv-publish/
          key: publish-venv-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            publish-venv-${{ runner.os }}-

      - name: Convert and publish ${{ matrix.variant }}
        run: bash scripts/publish-gguf.sh "${{ matrix.variant }}"
