name: bench

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Which published f16 GGUF to bench (single variant or 'all')"
        required: false
        default: "small"
        type: choice
        options:
          - small
          - small-registers
          - base
          - base-registers
          - large
          - large-registers
          - giant
          - giant-registers
          - all
      repeats:
        description: "Timed runs per cell (forwarded to scripts/bench.sh --repeats)"
        required: false
        default: "5"
        type: string
      threads:
        description: "OpenMP threads (forwarded to scripts/bench.sh --threads)"
        required: false
        default: "12"
        type: string

# Bench is on-demand: each workflow_dispatch run is independent and
# parallel-safe (different `runs` get different run IDs and thus
# different artifact namespaces). No concurrency-group singleflight.
concurrency:
  group: bench-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache python3 python3-pip

      - name: Install huggingface_hub CLI
        run: |
          python3 -m pip install --break-system-packages --quiet \
            "huggingface_hub[cli]"

      - name: Cache ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          max-size: 500MB
          save: false

      - name: Configure
        run: >-
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DDINOV2_BUILD_TESTS=OFF

      - name: Build dinov2-cli
        run: cmake --build build --target dinov2-cli -j"$(nproc)"

      - name: Resolve HF variants
        id: variants
        env:
          INPUT_VARIANT: ${{ inputs.variant }}
        run: |
          case "$INPUT_VARIANT" in
            all)
              echo "BENCH_MODELS=small,base,large,giant" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "BENCH_MODELS=$INPUT_VARIANT" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Download f16 GGUF(s)
        env:
          HF_HUB_ENABLE_HF_TRANSFER: "1"
          BENCH_MODELS: ${{ steps.variants.outputs.BENCH_MODELS }}
        run: |
          set -euo pipefail
          # scripts/bench.sh uses a separate directory for each published
          # regular or register-token checkpoint. Each HF repo uploads its
          # f16 file as model.gguf; no quantization benchmark selector is used.
          variant_list="${BENCH_MODELS//,/ }"
          for variant in $variant_list; do
            case "$variant" in
              small|base|large|giant)
                repo="dinov2-cpp-core/dinov2-${variant}-gguf"
                target_dir="models/dinov2-vit-${variant}-patch14"
                ;;
              small-registers|base-registers|large-registers|giant-registers)
                size="${variant%-registers}"
                repo="dinov2-cpp-core/dinov2-with-registers-${size}-gguf"
                target_dir="models/dinov2-with-registers-${size}-patch14"
                ;;
              *)
                echo "::error::Unsupported benchmark variant: $variant" >&2
                exit 1
                ;;
            esac
            mkdir -p "$target_dir"
            echo "Downloading $repo -> $target_dir/model.gguf"
            hf download \
              --repo-type model \
              --local-dir "$target_dir" \
              "$repo" "model.gguf"
          done

      - name: Verify staged weights
        env:
          BENCH_MODELS: ${{ steps.variants.outputs.BENCH_MODELS }}
          BENCH_VARIANT_INPUT: ${{ inputs.variant }}
        run: |
          set -euo pipefail
          provenance_path=benchmark_provenance.txt
          {
            printf 'workflow=bench.yml\n'
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'variant_input=%s\n' "$BENCH_VARIANT_INPUT"
            printf 'models=%s\n' "$BENCH_MODELS"
            printf 'image_path=assets/tench.jpg\n'
            printf 'build_configuration=Release\n'
            printf 'platform=ubuntu-latest\n'
            printf 'quantization=f16 only\n'
          } > "$provenance_path"
          variant_list="${BENCH_MODELS//,/ }"
          for variant in $variant_list; do
            case "$variant" in
              small|base|large|giant) target="models/dinov2-vit-${variant}-patch14/model.gguf" ;;
              small-registers|base-registers|large-registers|giant-registers) target="models/dinov2-with-registers-${variant%-registers}-patch14/model.gguf" ;;
              *) echo "::error::Unsupported benchmark variant: $variant" >&2; exit 1 ;;
            esac
            if [ ! -f "$target" ]; then
              echo "::error::Missing $target after download" >&2
              exit 3
            fi
            printf "%-50s %10d bytes\n" "$target" "$(stat -c %s "$target")"
            printf 'model_path=%s\n' "$target" >> "$provenance_path"
            sha256sum "$target" >> "$provenance_path"
          done
          echo "--- $provenance_path ---"
          cat "$provenance_path"

      - name: Run benchmarks
        env:
          BENCH_MODELS: ${{ steps.variants.outputs.BENCH_MODELS }}
          BENCH_REPEATS: ${{ inputs.repeats }}
          BENCH_THREADS: ${{ inputs.threads }}
          BENCH_BUILD_CONFIG: Release
        run: |
          set -euo pipefail
          echo "models selected: $BENCH_MODELS"
          echo "repeats: $BENCH_REPEATS"
          echo "threads: $BENCH_THREADS"
          chmod +x scripts/bench.sh
          bash scripts/bench.sh \
            --models "$BENCH_MODELS" \
            --repeats "$BENCH_REPEATS" \
            --threads "$BENCH_THREADS" \
            --image assets/tench.jpg \
            --bin build/bin/dinov2-cli \
            --out benchmark_results.txt
          echo "--- benchmark_results.txt ---"
          cat benchmark_results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ inputs.variant }}-${{ github.run_id }}
          path: |
            benchmark_results.txt
            benchmark_provenance.txt
          if-no-files-found: error
          retention-days: 90
